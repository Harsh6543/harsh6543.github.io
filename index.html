<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsh | Developer</title>
    <style>

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #58a6ff, #79c0ff);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        p {
            font-size: 1.2rem;
            color: #8b949e;
            margin-bottom: 32px;
        }

        .links a {
            display: inline-block;
            margin: 8px;
            padding: 10px 24px;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #58a6ff;
            text-decoration: none;
            transition: all 0.2s;
        }

        .links a:hover {
            background: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #8b949e;
            margin: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hey, I'm Harsh! 👋</h1>
        <p>Developer from Surat, Gujarat 🇮🇳</p>

        <div style="margin-bottom: 24px;">
            <span class="badge">Git</span>
            <span class="badge">GitHub</span>
            <span class="badge">Open Source</span>
            <span class="badge">JavaScript</span>
        </div>

        <div class="links">
            <a href="https://github.com/harsh6543" target="_blank">GitHub</a>
            <a href="mailto:your@email.com">Contact</a>
        </div>
    </div>
</body>
</html>
